<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATE369 Portfolio</title>
    <style>
        body {
            background-color: #071a0c;
            color: #fff;
            font-family: 'Outfit', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .phone-container {
            position: relative;
            width: 100%;
            max-width: 430px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .phone-container img {
            width: 100%;
            display: block;
        }
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #d4a843;
            color: #000;
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: bold;
            display: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="phone-container" id="app">
        <a href="#" class="back-btn" id="backBtn" onclick="switchPage('home')">← 返回首頁</a>
        <!-- 請確認這裡的圖片檔名與你資料夾裡的檔名完全一致 -->
        <img id="screenImg" src="home.png" alt="Portfolio Screen">
        <div id="hotspotsContainer"></div>
    </div>

    <script>
        const pages = {
            'home': {
                img: 'Bn_1920x600【首存】全館存款優惠_英.jpg', // 首頁圖片檔名
                spots: [
                    // 這裡之後可以調整按鈕的位置與點擊後跳轉的頁面
                ]
            }
        };

        function switchPage(pageKey) {
            const page = pages[pageKey];
            if (!page) return;
            document.getElementById('screenImg').src = page.img;
            document.getElementById('backBtn').style.display = (pageKey === 'home') ? 'none' : 'block';
        }
    </script>
</body>
</html>
