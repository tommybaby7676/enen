<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的個人作品集</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; line-height: 1.6; background: #f4f4f4; color: #333; }
        header { background: #333; color: #fff; padding: 2rem; text-align: center; }
        .container { width: 80%; margin: auto; overflow: hidden; padding: 2rem 0; }
        .projects { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem; }
        .card { background: #fff; padding: 1.5rem; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        footer { text-align: center; padding: 1.5rem; background: #333; color: #fff; margin-top: 2rem; }
    </style>
</head>
<body>
    <header>
        <h1>你好，我是 [你的名字]</h1>
        <p>前端工程師 / 網頁設計師</p>
    </header>
    <div class="container">
        <h2>精選作品</h2>
        <div class="projects">
            <div class="card">
                <h3>專案名稱一</h3>
                <p>這是專案的簡短描述，說明你使用了哪些技術與解決了什麼問題。</p>
            </div>
            <div class="card">
                <h3>專案名稱二</h3>
                <p>這是第二個專案的簡短描述與成果展示。</p>
            </div>
        </div>
    </div>
    <footer>
        <p>聯絡信箱：your.email@example.com</p>
    </footer>
</body>
</html>
